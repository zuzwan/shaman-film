# Engine test reel. Not story content: one scene per region of the world,
# exercising the new sprites, props, carried lights and region palettes.
# Caption text here is placeholder.
episode: ep00_test
resolution: [320, 180]   # x6 = 1920x1080
scale: 6
fps: 12

scenes:
  - id: s01_river_survey
    duration: 6
    transition_in: {duration: 1.0}
    backdrop:
      region: river
      time: day
      seed: 3
      props:
        - {type: tree, pos: [40, 152], height: 46, seed: 2, color: ink2, depth: 5}
    camera: {pan: [0, 30]}
    actors:   # a Survey column walking the route
      - {sprite: guard, med: guard_med,    state: walk, path: [[-20, 160], [190, 160]]}
      - {sprite: chainman, med: chainman_med, state: walk, path: [[-36, 161], [174, 161]], phase: 0.2}
      - {sprite: clerk, med: clerk_med,    state: walk, path: [[-52, 160], [158, 160]], phase: 0.4}
      - {sprite: guard, med: guard_med,    state: walk, path: [[-68, 161], [142, 161]], phase: 0.1}
    captions:
      - {t: [2.0, 5.5], text: "The column counted everything it passed."}

  - id: s02_uplands_road
    duration: 6
    backdrop:
      region: uplands
      time: dusk
      seed: 5
      props:
        - {type: tree, pos: [250, 152], height: 70, seed: 7, color: ink0, thick: 3}
    camera: {pan: [0, 50], ease: linear}
    actors:
      - {sprite: auk, med: auk_med,     state: walk, path: [[70, 162], [200, 162]]}
      - {sprite: teal, med: teal_med, state: walk, path: [[50, 163], [180, 163]], phase: 0.3,
         light: {offset: [5, -9], radius: 10, color: ember0, intensity: 0.6, flicker: true}}

  - id: s03_uplands_camp
    duration: 5
    backdrop:
      region: uplands
      time: night
      seed: 5
      weather: false
      props:
        - {type: moon, pos: [240, 36], r: 9, halo: 26, layer: -1, parallax: 0}
        - {type: fire, pos: [160, 160]}
    weather: none
    lights:
      - {pos: [160, 156], radius: 34, color: ember0, intensity: 0.5, flicker: true}
      - {pos: [160, 156], radius: 14, color: ember1, intensity: 0.6, flicker: true}
    actors:
      - {sprite: auk, med: auk_med,     state: idle, path: [[136, 163]]}
      - {sprite: teal, med: teal_med, state: idle, path: [[184, 163]], flip: true}
      - {sprite: rig,        state: hum,  path: [[205, 165]], flip: true}
    captions:
      - {t: [1.0, 4.5], text: "He had twelve animals in him and no name he answered to."}

  - id: s04_glass_town
    duration: 6
    backdrop:
      region: glass
      time: dusk
      seed: 2
      props:
        - {type: ruin, pos: [30, 132],  width: 80, height: 60, arches: 4, seed: 3, color: blood0, layer: 0, parallax: 0.2}
        - {type: ruin, pos: [190, 150], width: 110, height: 70, arches: 3, seed: 8, color: ink0, rim: blood2, layer: 2, parallax: 0.6}
    camera: {pan: [0, 40]}
    actors:
      - {sprite: auk, med: auk_med, state: walk, path: [[20, 162], [150, 162]]}

  - id: s05_coast
    duration: 5
    backdrop:
      region: coast
      time: dusk
      seed: 4
    weather: {type: rain, density: 0.25, wind: 0.5}
    actors:
      - {sprite: teal, med: teal_med, state: walk, path: [[60, 162], [150, 162]]}
      - {sprite: rig, state: hum, path: [[40, 164], [130, 164]]}

  - id: s06_interior_fold
    duration: 7
    transition_out: {duration: 2.0}
    backdrop:
      region: interior
      time: night
      seed: 6
      props:
        - {type: moon, pos: [70, 30], r: 7, halo: 22, layer: -1, parallax: 0}
        - {type: tree, pos: [20, 152],  height: 90, seed: 11, color: ink0, thick: 4, depth: 7}
        - {type: tree, pos: [300, 152], height: 80, seed: 12, color: ink0, thick: 4, depth: 7}
    actors:   # Fold hosts: one sprite, one gait, no phase offsets
      - {sprite: fold_host, med: fold_host_med, state: walk, path: [[340, 160], [140, 160]], flip: true}
      - {sprite: fold_host, med: fold_host_med, state: walk, path: [[356, 161], [156, 161]], flip: true}
      - {sprite: fold_host, med: fold_host_med, state: walk, path: [[372, 160], [172, 160]], flip: true}
      - {sprite: fold_host, med: fold_host_med, state: walk, path: [[388, 161], [188, 161]], flip: true}
      - {sprite: fold_host, med: fold_host_med, state: walk, path: [[404, 160], [204, 160]], flip: true}
    captions:
      - {t: [2.5, 6.0], text: "We saw them coming. We see most things."}
