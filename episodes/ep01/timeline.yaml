        - {id: q2, sprite: fold_host, state: idle, path: [[56, 128], [62, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: q3, sprite: fold_host, state: idle, path: [[72, 128], [78, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: q4, sprite: fold_host, state: idle, path: [[88, 128], [94, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: q5, sprite: fold_host, state: idle, path: [[104, 128], [110, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: q6, sprite: fold_host, state: idle, path: [[120, 128], [126, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: q7, sprite: fold_host, state: idle, path: [[136, 128], [142, 128]], t: [1.0, 1.6], ease: smooth}
        - {id: ida, sprite: ida, state: talk, path: [[246, 124]], flip: true}
        - {id: teal, sprite: teal, state: idle, path: [[220, 126]]}
      sfx: [{at: 1.0, fx: feet_many, count: 14, gain: 0.6}]
      cards:
        - {speaker: ida, text: "Wenna Cole. Abel Cole. Pryde, the overseer. Both Pryde boys. The Ashe woman, old Sarah."}
    - shot: medium · eye · static
      camera: {focus: [238, 128]}
      set: {pim: {state: talk}, teal: {state: talk}}
      cards:
        - {speaker: pim, text: "I could write them down for you."}
        - {speaker: teal, text: "I'd lose the paper. I don't lose knots."}
    - shot: close · eye · ida · static
      set: {ida: {flip: true}}
      cards:
        - {speaker: ida, text: "Will he remember them?"}
    - shot: close · eye · push-in
      camera: {zoom: [1, 1]}
      backdrop: {plain: true, sky: [ash2, ash3], props: []}
      actors: [{id: tc, sprite: teal_close, state: speak, path: [[170, 180]], breathe: 3}]
      cards:
        - {speaker: teal, text: "He doesn't keep names now. Not even mine. He keeps smells. I'll keep the names."}

