      cards:
        - {speaker: pim, text: "Twelve. Do I list him?"}
    - shot: medium · over-shoulder · teal · static
      set: {teal: {state: talk}}
      cards:
        - {speaker: ida, text: "He's not ours to list. Write the boy. Teal."}
        - {speaker: ida, text: "Last year's roll has a hundred and twelve. Ninety-one are here. I want the other twenty-one."}
        - {speaker: teal, text: "Found, or brought back?"}
        - {speaker: ida, text: "Counted. Where they went, and whether they're breathing. That's all the ledger asks."}
    - shot: medium · eye · static
      camera: {focus: [228, 128]}
      set: {teal: {state: talk}, ida: {state: talk}}
      cards:
        - {speaker: teal, text: "Two cakes of wax a day, and a full charge for the rig at the Varrow lodge after."}
        - {speaker: ida, text: "The office pays the lodge. It's paying more than I asked this season, so don't haggle."}
        - {speaker: teal, text: "I always haggle. It's the only fun he lets me have."}
    - shot: close · eye · pim · static
      set: {pim: {state: point}}
      cards:
        - {speaker: ida, text: "Pim wants to write \"one\" under households. The ledger hasn't got a column for whatever this is."}
