      sfx: [{at: 0.0, fx: feet_many, count: 14, gain: 0.5}]
    - shot: medium · eye · ida · static
      cards:
        - {speaker: ida, text: "You came in. They don't think of the stone here. They don't think of anything they don't need."}
    - shot: insert · eye · push-in
      duration: 2.2
      camera: {zoom: [1, 1.25], focus: [160, 120]}
      backdrop: {plain: true, sky: [ink1], props: [{type: forearm, pos: [150, 118], scars: 12}]}
