# EP01 "Here": the pilot. From /mnt/project-files/storyboard/episodes/ep01.md (26 scenes).
# Drafted with tools/script2timeline.py, then cut by hand: every scene is a shot list,
# shots carry their own cards, and `sound` / `sfx` cue the effects (engine/audio.py).
# `music` notes go to out/ep01/cues.yaml for the score after picture lock.
episode: ep01
resolution: [320, 180]
scale: 6
fps: 12
band: 40
intro: {episode: 1}

scenes:
# ---------------------------------------------------------------- SC01 sleeping standing
- id: sc01_sleeping_standing
  title: Sleeping standing
  transition_in: {duration: 0.6}
  music: {cue: 1M1 "Here" (cold open), in: 0.0, mood: "near silence; one low drone under the valve, nothing melodic until the match cut", out: end}
  backdrop: {region: river, time: night, seed: 4}
  weather: none
  sound:
    bed: [crickets, {river: 0.35}]
    events:
      - {at: 0.3, fx: ratchet, n: 3, gain: 1.2}
      - {at: 1.9, fx: valve, dur: 2.5, gain: 0.9}
      - {at: 6.0, fx: breath, dur: 4.5, rate: 0.28, gain: 0.8}
  actors:
    - {id: face, sprite: rig_face, state: dark, path: [[160, 150]], hidden: true}
  shots:
    - shot: insert · eye · static
      duration: 1.6
      backdrop: {plain: true, sky: [ink0], props: []}
    - shot: insert · eye · static
      duration: 1.2
      backdrop: {plain: true, sky: [ink0], props: []}
      set: {face: {hidden: false, state: wake}}
      lights: [{pos: [160, 112], radius: 30, color: ember0, intensity: 0.5}]
    - shot: insert · eye · static
      duration: 1.4
      backdrop: {plain: true, sky: [ink0], props: []}
      set: {face: {hidden: false, state: lit}}
      lights: [{pos: [160, 112], radius: 40, color: ember1, intensity: 0.6, pulse: 3}]
    - shot: close · eye · static
      duration: 3
      camera: {zoom: [2, 1], focus: [160, 110], ease: smooth}
      backdrop:
        plain: true
        sky: [night0, night1]
        props:
          - {type: stars, count: 50, y: 120}
          - {type: faces, pos: [160, 168], n: 5, size: 0.9, light: [0, 0.01]}
      lights: [{pos: [160, 110], radius: 70, color: ember0, intensity: 0.35, pulse: 3}]
    - shot: wide · eye · static
      duration: 4.5
      backdrop:
        props:
          - {type: stars, count: 60, y: 110, layer: -1}
          - {type: moon, pos: [268, 70], r: 5, halo: 14, layer: -1, parallax: 0}
          - {type: water, y: [128, 133], color: night2, shine: night3, flow: 2, layer: 0}
          - {type: slab, rect: [182, 152, 12, 2], color: ink0}
          - {type: frost, y: 150, count: 70}
          - {type: willow, x: 0, width: 330, depth: 110, layer: front, canopy: 44}
          - {type: tree, pos: [40, 156], height: 80, seed: 4, color: ink0, thick: 3, depth: 6}
          - {type: tree, pos: [290, 156], height: 70, seed: 8, color: ink0, thick: 3, depth: 6}
      actors:
        - {id: rig, sprite: rig, state: hum, path: [[168, 154]]}
        - {id: auk, sprite: auk, med: auk_med, state: doze, path: [[196, 154]], flip: true, breathe: 4, fps: 1}
        - {id: teal, sprite: teal, med: teal_med, state: sit_doze, path: [[150, 155]], breathe: 3.4, phase: 1.1, fps: 1}
      lights: [{pos: [168, 128], radius: 26, color: ember0, intensity: 0.5, pulse: 3}]

