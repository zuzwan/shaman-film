# The rig, per the world bible: a salvaged machine worshipped as a totem.
# Two columns of seven carved face-housings, one storage cell each. Auk's rig:
# 14 slots, 12 filled, 2 blank (bottom right, raw wood). Crank and leads at the base.
# States: idle (dark, a dead rig is a carved pole), hum (charged: eyes glow),
# capture (the last blank face flares as it takes an animal).
